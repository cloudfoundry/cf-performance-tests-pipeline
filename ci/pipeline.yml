groups:
- name: test
  jobs:
  - detect-new-versions
  - create-base-infra
  - deploy-director
  - upload-dev-capi-release
  - run-perf-tests-postgres-15
  - run-perf-tests-postgres
  - run-perf-tests-mysql
  - teardown
- name: manual-teardown
  jobs:
  - manual-teardown-cf-only
  - manual-teardown-bbl-only
  - manual-teardown-base-infra-only
  - manual-teardown-all

anchors:
  system_domain: &system_domain cf.p-((cloud_controller_type))((test_suffix)).((parent_zone_domain))
  alert_failure: &alert_failure
    on_failure:
      put: slack-notification
      params:
        alert_type: failed
  delete_cf: &delete_cf
    task: bosh-delete-deployments
    attempts: 3
    file: cf-deployment-concourse-tasks/bosh-delete-deployment/task.yml
    params:
      BBL_STATE_DIR: perf-tests/bbl-state
      DELETE_ALL_DEPLOYMENTS: true
      IGNORE_ERRORS: true
  bbl_state_upload: &bbl_state_upload
    put: bbl-state
    attempts: 3
    params:
      repository: updated-bbl-state
      rebase: true
  bbl_destroy: &bbl_destroy
    task: bbl-destroy
    file: cf-deployment-concourse-tasks/bbl-destroy/task.yml
    input_mapping:
      bbl-state: bbl-state
    params:
      BBL_STATE_DIR: perf-tests/bbl-state
      BBL_AWS_ACCESS_KEY_ID: ((.:base-infra.bbl_aws_creds.aws_access_key_id))
      BBL_AWS_SECRET_ACCESS_KEY: ((.:base-infra.bbl_aws_creds.aws_secret_access_key))
      BBL_AWS_REGION: ((region))
      TF_VAR_elb_idle_timeout: ((cf_router_idle_timeout_secs))
    ensure:
      <<: *bbl_state_upload
  bbl_up: &bbl_up
    task: bbl-up
    file: cf-deployment-concourse-tasks/bbl-up/task.yml
    input_mapping:
      bbl-state: bbl-state
      bbl-config: cf-performance-tests-pipeline
    params:
      BBL_IAAS: aws
      BBL_ENV_NAME: perf-test-((cloud_controller_type))((test_suffix))
      BBL_AWS_ACCESS_KEY_ID: ((.:base-infra.bbl_aws_creds.aws_access_key_id))
      BBL_AWS_SECRET_ACCESS_KEY: ((.:base-infra.bbl_aws_creds.aws_secret_access_key))
      BBL_AWS_REGION: ((region))
      BBL_STATE_DIR: perf-tests/bbl-state
      BBL_CONFIG_DIR: bbl-patches
      BBL_LB_CERT: ((.:base-infra.cert_pem))
      BBL_LB_KEY: ((.:base-infra.private_key))
      LB_DOMAIN: *system_domain
      SKIP_LB_CREATION: false
      TF_VAR_elb_idle_timeout: ((cf_router_idle_timeout_secs))
    ensure:
      <<: *bbl_state_upload
  destroy_base_infra: &destroy_base_infra
    put: base-infra
    attempts: 3
    params:
      action: destroy
      terraform_source: cf-performance-tests-pipeline/base-infra/terraform
    get_params:
      action: destroy
  destroy_director_and_base_infra: &destroy_director_and_base_infra
    do:
      - *bbl_destroy
      - *destroy_base_infra
  destroy_all: &destroy_all
    do: [*delete_cf, *destroy_director_and_base_infra]

resource_types:
- name: slack-alert
  type: registry-image
  source:
    repository: arbourd/concourse-slack-alert-resource
- name: terraform
  type: registry-image
  source:
    repository: ljfranklin/terraform-resource
    tag: latest

resources:
  - name: cf-deployment-concourse-tasks
    type: git
    icon: github
    source:
      uri: https://github.com/cloudfoundry/cf-deployment-concourse-tasks.git
  - name: capi-ci
    type: git
    icon: github
    source:
      uri: https://github.com/cloudfoundry/capi-ci.git
      branch: main
      username: ((ari-wg-gitbot-username))
      password: ((ari-wg-gitbot-token))
  - name: cf-performance-tests-pipeline
    type: git
    icon: github
    source:
      uri: https://github.com/cloudfoundry/cf-performance-tests-pipeline.git
      username: ((ari-wg-gitbot-username))
      password: ((ari-wg-gitbot-token))
      branch: main
      ignore_paths: [results/**]
  - name: results
    type: git
    icon: github
    source:
      uri: https://github.com/cloudfoundry/cf-performance-tests-pipeline.git
      username: ((ari-wg-gitbot-username))
      password: ((ari-wg-gitbot-token))
      branch: ((results-branch))

  - name: bbl-state
    type: git
    icon: git
    source:
      uri: https://github.com/cloudfoundry/capi-ci-private.git
      branch: main
      username: ((ari-wg-gitbot-username))
      password: ((ari-wg-gitbot-token))
  - name: cf-deployment
    type: git
    icon: github
    source:
      uri: https://github.com/cloudfoundry/cf-deployment.git
      tag_filter: v*
  - name: capi-release-ci-passed
    type: git
    icon: github
    source:
      uri: https://github.com/cloudfoundry/capi-release.git
      branch: ci-passed
  - name: next-version
    type: semver
    icon: counter
    source:
      driver: gcs
      bucket: capi-release-versions-app-runtime-interfaces
      key: current-capi-release-version
      json_key: ((capi-release-blobs-uploader_key))
      initial_version: 1.176.0
  - name: slack-notification
    type: slack-alert
    source:
      url: ((cf-perf-slack-notification-url))
  - name: concourse-tasks
    type: git
    icon: github
    source:
      uri: https://github.com/EngineerBetter/concourse-tasks.git
      tag_regex: '[0-9]+\.[0-9]+\.[0-9]+'
  - name: base-infra
    type: terraform
    icon: terraform
    source:
      env_name: terraform
      backend_type: s3
      backend_config:
        bucket: ((state-bucket-name))
        workspace_key_prefix: ((cloud_controller_type))((test_suffix))
        key: base-infra.tfstate
        region: ((region))
        access_key: ((aws-pipeline-user-id))
        secret_key: ((aws-pipeline-user-secret))
      env:
        AWS_ACCESS_KEY_ID: ((aws-pipeline-user-id))
        AWS_SECRET_ACCESS_KEY: ((aws-pipeline-user-secret))
        AWS_DEFAULT_REGION: ((region))
      vars:
        test_environment: ((cloud_controller_type))((test_suffix))
        system_domain: *system_domain
        region: ((region))

jobs:
  - name: detect-new-versions
    serial: true
    <<: *alert_failure
    plan:
      - get: cf-performance-tests-pipeline
        trigger: true
      - get: capi-release-ci-passed
        trigger: true
      - set_pipeline: self
        file: cf-performance-tests-pipeline/ci/pipeline.yml
        var_files:
        - cf-performance-tests-pipeline/variables/((cloud_controller_type))((test_suffix)).yml
        - cf-performance-tests-pipeline/variables/common.yml

  - name: create-base-infra
    serial: true
    serial_groups: [deploy-test-destroy]
    <<: *alert_failure
    plan:
      - get: cf-performance-tests-pipeline
        trigger: true
        passed: [detect-new-versions]
      - get: capi-release-ci-passed
        trigger: true
        passed: [detect-new-versions]
      - put: base-infra
        attempts: 3
        params:
          terraform_source: cf-performance-tests-pipeline/base-infra/terraform

  - name: deploy-director
    serial: true
    serial_groups: [deploy-test-destroy]
    <<: *alert_failure
    plan:
      - in_parallel:
        - get: cf-performance-tests-pipeline
          trigger: true
          passed: [create-base-infra]
        - get: capi-release-ci-passed
          trigger: true
          passed: [create-base-infra]
        - get: cf-deployment-concourse-tasks
        - get: capi-ci
        - get: bbl-state
        - get: base-infra
      - load_var: base-infra
        file: base-infra/metadata
        format: json
      - *bbl_up
      - task: create-dns-record
        attempts: 3
        file: capi-ci/ci/bbl-tasks/create_dns_record.yml
        input_mapping:
          bbl-state: updated-bbl-state
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          DNS_DOMAIN: *system_domain
          SHARED_DNS_ZONE_NAME: app-runtime-interfaces
          GCP_DNS_SERVICE_ACCOUNT_KEY: ((capi-bbl-dns-service-account))
          GCP_PROJECT_ID: app-runtime-interfaces-wg

  - name: upload-dev-capi-release
    serial: true
    serial_groups: [deploy-test-destroy]
    <<: *alert_failure
    plan:
      - in_parallel:
        - get: cf-performance-tests-pipeline
          trigger: true
          passed: [deploy-director]
        - get: capi-release-ci-passed
          trigger: true
          passed: [deploy-director]
        - get: cf-deployment
        - get: next-version
        - get: capi-ci
        - get: bbl-state
          passed: [deploy-director]
      - task: write-release-candidate-version
        attempts: 3
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: cloudfoundry/cf-deployment-concourse-tasks
              tag: latest
          inputs:
            - name: capi-release-ci-passed
          outputs:
            - name: release-candidate-version
          run:
            path: sh
            args:
              - -ec
              - |
                short_sha="$(git -C capi-release-ci-passed rev-parse --short HEAD)"
                release_version="perf-test-${short_sha}"
                echo "$release_version" > release-candidate-version/version
                echo "Generated release candidate version: $release_version"
      - task: create-capi-release
        attempts: 3
        file: capi-ci/ci/bosh/create_capi_release.yml
        input_mapping:
          capi-release: capi-release-ci-passed
          next-version: release-candidate-version
        output_mapping:
          created-capi-release: release-tarball
      - task: upload-capi-release-tarball
        attempts: 3
        file: capi-ci/ci/bosh/upload_capi_release_tarball.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state

  - name: run-perf-tests-postgres-15
    serial: true
    serial_groups: [deploy-test-destroy]
    <<: *alert_failure
    plan:
      - in_parallel:
        - get: cf-performance-tests-pipeline
          trigger: true
          passed: [upload-dev-capi-release]
        - get: capi-release-ci-passed
          trigger: true
          passed: [upload-dev-capi-release]
        - get: cf-deployment
          passed: [upload-dev-capi-release]
        - get: next-version
          passed: [upload-dev-capi-release]
        - get: cf-deployment-concourse-tasks
        - get: bbl-state
          passed: [upload-dev-capi-release]
        - get: base-infra
        - get: concourse-tasks
      - load_var: base-infra
        file: base-infra/metadata
        format: json
      - in_parallel:
          - task: combine-ops-file-directories
            attempts: 3
            file: concourse-tasks/combine-directories/task.yml
            input_mapping:
              src-1: cf-deployment
              src-2: cf-performance-tests-pipeline
            params:
              SRC_1_GLOB: operations/*.yml
              SRC_2_GLOB: operations/*.yml
            output_mapping:
              target: combined-ops-files
          - task: write-bosh-vars-file
            attempts: 3
            file: cf-performance-tests-pipeline/ci/tasks/write-bosh-vars-file/task.yml
            params:
              VARS:
                aws_region: ((region))
                blobstore_access_key_id: ((.:base-infra.cloud_controller_aws_creds.aws_access_key_id))
                blobstore_secret_access_key: ((.:base-infra.cloud_controller_aws_creds.aws_secret_access_key))
                app_package_directory_key: ((.:base-infra.packages_bucket_name))
                buildpack_directory_key: ((.:base-infra.buildpacks_bucket_name))
                droplet_directory_key: ((.:base-infra.droplets_bucket_name))
                resource_directory_key: ((.:base-infra.resources_bucket_name))
                test-suite-folder: ((test-suite-folder))
          - task: get-artifacts-versions
            file: cf-performance-tests-pipeline/ci/tasks/get-artifact-versions/task.yml
      - task: combine-vars-file-directories
        attempts: 3
        file: concourse-tasks/combine-directories/task.yml
        input_mapping:
          src-1: cf-vars-file
          src-2: cf-versions
        output_mapping:
          target: combined-vars-files
      - task: deploy-cf
        attempts: 3
        file: cf-deployment-concourse-tasks/bosh-deploy/task.yml
        input_mapping:
          ops-files: combined-ops-files
          vars-files: combined-vars-files
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          MANIFEST_FILE: cf-deployment.yml
          SYSTEM_DOMAIN: *system_domain
          VARS_FILES: "cf-vars.yml cf_versions.yml"
          OPS_FILES: "operations/performance-tests-errand.yml operations/use-compiled-releases.yml operations/use-latest-capi.yml operations/use-postgres.yml operations/use-postgres-15.yml((additional-ops-files)) operations/scale-up-vms.yml operations/use-external-blobstore.yml operations/use-s3-blobstore.yml operations/log-db-queries.yml operations/tag-bbl-env.yml"
          BOSH_DEPLOY_ARGS: "--var=results_folder=/tmp/results/rails/postgres15/results/"
      - task: bosh-clean-up
        attempts: 3
        file: cf-deployment-concourse-tasks/bosh-cleanup/task.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
      - task: run-performance-tests
        attempts: 3
        file: cf-deployment-concourse-tasks/run-errand/task.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          DEPLOYMENT_NAME: cf
          ERRAND_NAME: cf-performance-tests-errand
          KEEP_ALIVE: true
      - load_var: cf-versions
        file: cf-versions/cf_versions.yml
        format: yaml
      - task: commit-test-results
        attempts: 3
        file: cf-performance-tests-pipeline/ci/tasks/commit-test-results/task.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          GIT_COMMIT_EMAIL: ((ari-wg-gitbot-email))
          GIT_COMMIT_USERNAME: ((ari-wg-gitbot-username))
          GIT_COMMIT_MESSAGE: Results for capi-release ((.:cf-versions.capi_version)), ((cloud_controller_type)) cc with postgres 15 ccdb
      - put: results
        params:
          repository: cf-performance-tests-pipeline
          rebase: true
      - *delete_cf
  - name: run-perf-tests-postgres
    serial: true
    serial_groups: [deploy-test-destroy]
    <<: *alert_failure
    plan:
      - in_parallel:
        - get: cf-performance-tests-pipeline
          trigger: true
          passed: [run-perf-tests-postgres-15]
        - get: capi-release-ci-passed
          trigger: true
          passed: [run-perf-tests-postgres-15]
        - get: cf-deployment
          passed: [run-perf-tests-postgres-15]
        - get: next-version
          passed: [run-perf-tests-postgres-15]
        - get: cf-deployment-concourse-tasks
        - get: bbl-state
          passed: [run-perf-tests-postgres-15]
        - get: base-infra
        - get: concourse-tasks
      - load_var: base-infra
        file: base-infra/metadata
        format: json
      - in_parallel:
        - task: combine-ops-file-directories
          attempts: 3
          file: concourse-tasks/combine-directories/task.yml
          input_mapping:
            src-1: cf-deployment
            src-2: cf-performance-tests-pipeline
          params:
            SRC_1_GLOB: operations/*.yml
            SRC_2_GLOB: operations/*.yml
          output_mapping:
            target: combined-ops-files
        - task: write-bosh-vars-file
          attempts: 3
          file: cf-performance-tests-pipeline/ci/tasks/write-bosh-vars-file/task.yml
          params:
            VARS:
              aws_region: ((region))
              blobstore_access_key_id: ((.:base-infra.cloud_controller_aws_creds.aws_access_key_id))
              blobstore_secret_access_key: ((.:base-infra.cloud_controller_aws_creds.aws_secret_access_key))
              app_package_directory_key: ((.:base-infra.packages_bucket_name))
              buildpack_directory_key: ((.:base-infra.buildpacks_bucket_name))
              droplet_directory_key: ((.:base-infra.droplets_bucket_name))
              resource_directory_key: ((.:base-infra.resources_bucket_name))
              test-suite-folder: ((test-suite-folder))
        - task: get-artifacts-versions
          file: cf-performance-tests-pipeline/ci/tasks/get-artifact-versions/task.yml
      - task: combine-vars-file-directories
        attempts: 3
        file: concourse-tasks/combine-directories/task.yml
        input_mapping:
          src-1: cf-vars-file
          src-2: cf-versions
        output_mapping:
          target: combined-vars-files
      - task: deploy-cf
        attempts: 3
        file: cf-deployment-concourse-tasks/bosh-deploy/task.yml
        input_mapping:
          ops-files: combined-ops-files
          vars-files: combined-vars-files
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          MANIFEST_FILE: cf-deployment.yml
          SYSTEM_DOMAIN: *system_domain
          VARS_FILES: "cf-vars.yml cf_versions.yml"
          OPS_FILES: "operations/performance-tests-errand.yml operations/use-compiled-releases.yml operations/use-latest-capi.yml operations/use-postgres.yml((additional-ops-files)) operations/scale-up-vms.yml operations/use-external-blobstore.yml operations/use-s3-blobstore.yml operations/log-db-queries.yml operations/tag-bbl-env.yml"
          BOSH_DEPLOY_ARGS: "--var=results_folder=/tmp/results/rails/postgres/results/"
      - task: bosh-clean-up
        attempts: 3
        file: cf-deployment-concourse-tasks/bosh-cleanup/task.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
      - task: run-performance-tests
        attempts: 3
        file: cf-deployment-concourse-tasks/run-errand/task.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          DEPLOYMENT_NAME: cf
          ERRAND_NAME: cf-performance-tests-errand
          KEEP_ALIVE: true
      - load_var: cf-versions
        file: cf-versions/cf_versions.yml
        format: yaml
      - task: commit-test-results
        attempts: 3
        file: cf-performance-tests-pipeline/ci/tasks/commit-test-results/task.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          GIT_COMMIT_EMAIL: ((ari-wg-gitbot-email))
          GIT_COMMIT_USERNAME: ((ari-wg-gitbot-username))
          GIT_COMMIT_MESSAGE: Results for capi-release ((.:cf-versions.capi_version)), ((cloud_controller_type)) cc with postgres ccdb
      - put: results
        params:
          repository: cf-performance-tests-pipeline
          rebase: true
      - *delete_cf

  - name: run-perf-tests-mysql
    serial: true
    serial_groups: [deploy-test-destroy]
    <<: *alert_failure
    plan:
      - in_parallel:
        - get: cf-performance-tests-pipeline
          trigger: true
          passed: [run-perf-tests-postgres]
        - get: capi-release-ci-passed
          trigger: true
          passed: [run-perf-tests-postgres]
        - get: cf-deployment
          passed: [run-perf-tests-postgres]
        - get: next-version
          passed: [run-perf-tests-postgres]
        - get: cf-deployment-concourse-tasks
        - get: bbl-state
          passed: [run-perf-tests-postgres]
        - get: base-infra
        - get: concourse-tasks
      - load_var: base-infra
        file: base-infra/metadata
        format: json
      - in_parallel:
        - task: combine-ops-file-directories
          attempts: 3
          file: concourse-tasks/combine-directories/task.yml
          input_mapping:
            src-1: cf-deployment
            src-2: cf-performance-tests-pipeline
          params:
            SRC_1_GLOB: operations/*.yml
            SRC_2_GLOB: operations/*.yml
          output_mapping:
            target: combined-ops-files
        - task: write-bosh-vars-file
          attempts: 3
          file: cf-performance-tests-pipeline/ci/tasks/write-bosh-vars-file/task.yml
          params:
            VARS:
              aws_region: ((region))
              blobstore_access_key_id: ((.:base-infra.cloud_controller_aws_creds.aws_access_key_id))
              blobstore_secret_access_key: ((.:base-infra.cloud_controller_aws_creds.aws_secret_access_key))
              app_package_directory_key: ((.:base-infra.packages_bucket_name))
              buildpack_directory_key: ((.:base-infra.buildpacks_bucket_name))
              droplet_directory_key: ((.:base-infra.droplets_bucket_name))
              resource_directory_key: ((.:base-infra.resources_bucket_name))
              test-suite-folder: ((test-suite-folder))
        - task: get-artifacts-versions
          file: cf-performance-tests-pipeline/ci/tasks/get-artifact-versions/task.yml
      - task: combine-vars-file-directories
        attempts: 3
        file: concourse-tasks/combine-directories/task.yml
        input_mapping:
          src-1: cf-vars-file
          src-2: cf-versions
        output_mapping:
          target: combined-vars-files
      - task: deploy-cf
        attempts: 3
        file: cf-deployment-concourse-tasks/bosh-deploy/task.yml
        input_mapping:
          ops-files: combined-ops-files
          vars-files: combined-vars-files
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          MANIFEST_FILE: cf-deployment.yml
          SYSTEM_DOMAIN: *system_domain
          VARS_FILES: "cf-vars.yml cf_versions.yml"
          OPS_FILES: "operations/performance-tests-errand.yml operations/use-compiled-releases.yml operations/use-latest-capi.yml((additional-ops-files)) operations/scale-up-vms.yml operations/use-external-blobstore.yml operations/use-s3-blobstore.yml operations/log-db-queries.yml operations/tag-bbl-env.yml"
          BOSH_DEPLOY_ARGS: "--var=results_folder=/tmp/results/rails/mysql/results/"
      - task: bosh-clean-up
        attempts: 3
        file: cf-deployment-concourse-tasks/bosh-cleanup/task.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
      - task: run-performance-tests
        attempts: 3
        file: cf-deployment-concourse-tasks/run-errand/task.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          DEPLOYMENT_NAME: cf
          ERRAND_NAME: cf-performance-tests-errand
          KEEP_ALIVE: true
      - load_var: cf-versions
        file: cf-versions/cf_versions.yml
        format: yaml
      - task: commit-test-results
        attempts: 3
        file: cf-performance-tests-pipeline/ci/tasks/commit-test-results/task.yml
        params:
          BBL_STATE_DIR: perf-tests/bbl-state
          GIT_COMMIT_EMAIL: ((ari-wg-gitbot-email))
          GIT_COMMIT_USERNAME: ((ari-wg-gitbot-username))
          GIT_COMMIT_MESSAGE: Results for capi-release ((.:cf-versions.capi_version)), ((cloud_controller_type)) cc with mysql ccdb
      - put: results
        params:
          repository: cf-performance-tests-pipeline
          rebase: true
      - *delete_cf

  - name: teardown
    serial: true
    serial_groups: [deploy-test-destroy]
    <<: *alert_failure
    plan:
      - in_parallel:
        - get: cf-performance-tests-pipeline
          trigger: true
          passed: [run-perf-tests-mysql]
        - get: capi-release-ci-passed
          trigger: true
          passed: [run-perf-tests-mysql]
        - get: cf-deployment-concourse-tasks
        - get: bbl-state
        - get: base-infra
      - load_var: base-infra
        file: base-infra/metadata
        format: json
      - *destroy_all

  - name: manual-teardown-cf-only
    serial: true
    serial_groups: [deploy-test-destroy]
    plan:
    - in_parallel:
      - get: cf-deployment-concourse-tasks
      - get: bbl-state
    - *delete_cf

  - name: manual-teardown-bbl-only
    serial: true
    serial_groups: [deploy-test-destroy]
    plan:
    - in_parallel:
      - get: cf-deployment-concourse-tasks
      - get: bbl-state
      - get: base-infra
    - load_var: base-infra
      file: base-infra/metadata
      format: json
    - *bbl_destroy

  - name: manual-teardown-base-infra-only
    serial: true
    serial_groups: [deploy-test-destroy]
    plan:
    - get: cf-performance-tests-pipeline
    - *destroy_base_infra

  - name: manual-teardown-all
    serial: true
    serial_groups: [deploy-test-destroy]
    plan:
    - in_parallel:
      - get: cf-performance-tests-pipeline
      - get: cf-deployment-concourse-tasks
      - get: bbl-state
      - get: base-infra
    - load_var: base-infra
      file: base-infra/metadata
      format: json
    - *destroy_all
